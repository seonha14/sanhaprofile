<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanha Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a1a 30%, #2a1a2a 70%, #0f0f0f 100%);
            min-height: 100vh;
            font-family: 'Courier New', 'Monaco', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(138, 43, 226, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(219, 112, 147, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(75, 0, 130, 0.04) 0%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: backgroundPulse 8s ease-in-out infinite;
        }
        
        body::after {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                repeating-linear-gradient(
                    45deg,
                    transparent,
                    transparent 100px,
                    rgba(255, 255, 255, 0.01) 100px,
                    rgba(255, 255, 255, 0.01) 102px
                );
            pointer-events: none;
            z-index: -1;
            animation: backgroundMove 20s linear infinite;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 400px;
        }
        
        .glass {
            background: linear-gradient(135deg, rgba(40, 40, 40, 0.8) 0%, rgba(60, 60, 60, 0.6) 50%, rgba(30, 30, 30, 0.8) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        .profile-card {
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
        }
        
        .profile-image {
            background: linear-gradient(45deg, #ffffff, #f0f0f0);
            padding: 3px;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin: 0 auto 24px auto;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }
        
        .profile-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(45deg, #2a2a2a, #1a1a1a);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 40px;
            font-weight: normal;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .name {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }
        
        .title {
            font-size: 14px;
            color: #c0c0c0;
            margin-bottom: 24px;
            text-shadow: 0 0 3px rgba(255, 255, 255, 0.2);
            font-weight: 400;
        }
        
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-bottom: 0;
        }
        
        .social-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d0d0d0;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.15);
            font-size: 16px;
        }
        
        .social-icon:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .social-icon.facebook:hover { color: #ffffff; }
        .social-icon.instagram:hover { color: #ffffff; }
        .social-icon.linkedin:hover { color: #ffffff; }
        .social-icon.github:hover { color: #ffffff; }
        
        .contact-btn {
            border-radius: 50px;
            padding: 12px 32px;
            color: #ffffff;
            font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.3);
        }
        
        .contact-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.6);
        }
        
        .portfolio-section {
            width: 100%;
            max-width: 400px;
        }
        
        .portfolio-title {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            text-align: center;
            margin-bottom: 24px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .project-button {
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: linear-gradient(135deg, rgba(40, 40, 40, 0.8) 0%, rgba(60, 60, 60, 0.6) 50%, rgba(30, 30, 30, 0.8) 100%);
            cursor: pointer;
            text-decoration: none;
            width: 100%;
            opacity: 0;
            transform: translateX(-50px);
            animation: slideInLeft 0.6s ease forwards;
        }
        
        .project-button:nth-child(1) { animation-delay: 0.1s; }
        .project-button:nth-child(2) { animation-delay: 0.2s; }
        .project-button:nth-child(3) { animation-delay: 0.3s; }
        .project-button:nth-child(4) { animation-delay: 0.4s; }
        .project-button:nth-child(5) { animation-delay: 0.5s; }
        
        .project-button:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-5px) scale(1.02);
        }
        
        .project-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
        }
        
        .project-info p {
            font-size: 14px;
            color: #e0e0e0;
        }
        
        .project-link {
            color: #d0d0d0;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
        }
        
        .project-button:hover .project-link {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes slideInLeft {
            0% {
                opacity: 0;
                transform: translateX(-50px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        @keyframes backgroundPulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }
        
        @keyframes backgroundMove {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .profile-card {
                padding: 32px 24px;
            }
            
            .profile-image {
                width: 120px;
                height: 120px;
            }
            
            .profile-photo {
                font-size: 48px;
            }
            
            .name {
                font-size: 24px;
            }
            
            .social-icons {
                gap: 16px;
            }
            
            .social-icon {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>
